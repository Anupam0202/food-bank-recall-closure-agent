[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "food-bank-recall-closure-agent"
version = "1.3.0"
description = "Closed-loop internal food-recall response coordinator"
requires-python = ">=3.12,<3.14"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "release-validation", "preview"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.fastapi.static]
cdn = false
